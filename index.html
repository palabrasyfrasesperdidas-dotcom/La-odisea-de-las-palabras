<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palabras y frases perdidas | Manuscrito</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #120a06;
            color: #2c221e;
            font-family: 'Amiri', serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* HUD Superior */
        .hud-header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            background: rgba(244, 235, 215, 0.92);
            border: 1px solid #5a3c1e;
            padding: 8px 25px;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .hud-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: #3b2613;
            letter-spacing: 2px;
        }
        .hud-header p {
            font-size: 0.75rem;
            color: #7a2d10;
            font-style: italic;
        }

        /* Controles de Navegación */
        .page-nav {
            position: absolute;
            bottom: 25px;
            right: 30px;
            z-index: 10;
            display: flex;
            gap: 12px;
        }
        .nav-btn {
            background: #f4ebd7;
            border: 1px solid #5a3c1e;
            color: #3b2613;
            padding: 10px 20px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            border-radius: 3px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        .nav-btn:hover {
            background: #7a2d10;
            color: #f4ebd7;
        }

        .page-indicator {
            position: absolute;
            bottom: 25px;
            left: 30px;
            z-index: 10;
            background: rgba(244, 235, 215, 0.92);
            border: 1px solid #5a3c1e;
            padding: 10px 20px;
            border-radius: 4px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            color: #3b2613;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        /* Menú de Idiomas Interactivo sobre el libro abierto */
        .interactive-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .language-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            pointer-events: auto;
            background: rgba(244, 235, 215, 0.96);
            border: 2px solid #5a3c1e;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            max-width: 440px;
            text-align: center;
            display: none;
        }
        .language-grid h3 {
            grid-column: span 2;
            font-family: 'Cinzel', serif;
            color: #7a2d10;
            margin-bottom: 10px;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }
        .lang-btn {
            background: #5a3c1e;
            color: #f4ebd7;
            border: none;
            padding: 7px 10px;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            letter-spacing: 1px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-btn:hover {
            background: #7a2d10;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <div class="hud-header">
        <h1>PALABRAS Y FRASES PERDIDAS</h1>
        <p id="hudSubtitle">Haz clic sobre la portada del libro para abrirlo</p>
    </div>

    <div class="page-indicator" id="pageIndicator">Libro Cerrado</div>

    <div class="page-nav">
        <button class="nav-btn" onclick="prevStep()">Cerrar / Anterior</button>
        <button class="nav-btn" onclick="nextStep()">Siguiente Página</button>
    </div>

    <div class="interactive-overlay">
        <div class="language-grid" id="langMenu">
            <h3>SELECCIONA TU IDIOMA</h3>
            <button class="lang-btn" onclick="selectLanguage('es')">Español</button>
            <button class="lang-btn" onclick="selectLanguage('en')">English</button>
            <button class="lang-btn" onclick="selectLanguage('fr')">Français</button>
            <button class="lang-btn" onclick="selectLanguage('de')">Deutsch</button>
            <button class="lang-btn" onclick="selectLanguage('ru')">Русский</button>
            <button class="lang-btn" onclick="selectLanguage('hi')">हिन्दी</button>
            <button class="lang-btn" onclick="selectLanguage('ja')">日本語</button>
            <button class="lang-btn" onclick="selectLanguage('pt')">Português</button>
            <button class="lang-btn" onclick="selectLanguage('ar')">العربية</button>
            <button class="lang-btn" onclick="selectLanguage('fa')">فارسی</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const phrasesDB = {
            es: [
                "El destino no se cruza en nuestro camino; se dibuja con cada silencio que decidimos no romper.",
                "Toda geometría es un intento del alma por ordenar el caos que habita en las estrellas.",
                "Hay líneas invisibles que atan nuestros pasos a promesas que nunca llegamos a pronunciar.",
                "El compás del tiempo mide círculos cerrados donde el pasado y el futuro siempre se besan.",
                "Perderse en la niebla es el precio obligado para encontrar el centro exacto de uno mismo."
            ],
            en: [
                "Destiny does not cross our path; it is drawn with every silence we choose not to break.",
                "All geometry is the soul's attempt to order the chaos dwelling within the stars.",
                "There are invisible lines binding our steps to promises we never manage to voice."
            ],
            fr: [
                "Le destin ne croise pas notre chemin ; il se dessine avec chaque silence que nous choisissons de ne pas briser.",
                "Toute géométrie est une tentative de l'âme pour ordonner le chaos qui habite les étoiles."
            ],
            de: [
                "Das Schicksal kreuzt nicht unseren Weg; es wird mit jedem Schweigen gezeichnet, das wir nicht zu brechen wagen.",
                "Jede Geometrie ist der Versuch der Seele, das Chaos in den Sternen zu ordnen."
            ],
            ru: [
                "Судьба не пересекает наш путь; она рисуется каждым молчанием, которое мы решаем не нарушать.",
                "Всякая геометрия — это попытка души упорядочить хаос, живущий в звездах."
            ],
            hi: [
                "भाग्य हमारे रास्ते को पार नहीं करता; इसे हर उस सन्नाटे से खींचा जाता है जिसे हम न तोड़ने का फैसला करते हैं।",
                "हर ज्यामिति आत्मा का तारों के भीतर बसने वाले caos को व्यवस्थित करने का प्रयास है।"
            ],
            ja: [
                "運命は私たちの道を横切るのではなく、私たちが破らないと決めた沈黙ごとに描かれます。",
                "すべての幾何学は、星の中に宿るカオスを秩序づけようとする魂の試みです。"
            ],
            pt: [
                "O destino não cruza o nosso caminho; desenha-se com cada silêncio que decidimos não quebrar.",
                "Toda geometria é uma tentativa da alma de ordenar o caos que habita nas estrelas."
            ],
            ar: [
                "لا يتقاطع القدر مع طريقنا؛ بل يُرسم بكل صمت نختار عدم كسره.",
                "كل هندسة هي محاولة للروح لترتيب الفوضى التي تسكن النجوم."
            ],
            fa: [
                "سرنوشت مسیر ما را قطع نمی‌کند؛ بلکه با هر سکوتی که تصمیم می‌گیریم نشکنیم، ترسیم می‌شود.",
                "هر هندسه‌ای تلاش روح برای نظم بخشیدن به آشفتگی درون ستارگان است."
            ]
        };

        let scene, camera, renderer, bookMesh, closedBookMesh;
        let currentStep = 0; // 0: Cerrado, 1: Índice de idiomas, 2+: Frases aleatorias
        let selectedLang = 'es';
        let raycaster, mouse;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x120a06);

            // Cámara cenital inclinada realista (vista superior natural sobre la mesa)
            camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 11, 4.5);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Iluminación cálida de estudio
            const ambient = new THREE.AmbientLight(0xfff3e0, 1.2);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffeed1, 1.4);
            sun.position.set(3, 10, 4);
            sun.castShadow = true;
            scene.add(sun);

            createDesk();
            createBookModels();

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onDocumentClick);

            animate();
        }

        function createDesk() {
            // Mesa de madera rústica ocupando el fondo
            const deskGeo = new THREE.PlaneGeometry(30, 30);
            const deskMat = new THREE.MeshStandardMaterial({
                color: 0x1f120a,
                roughness: 0.85,
                metalness: 0.05
            });
            const desk = new THREE.Mesh(deskGeo, deskMat);
            desk.rotation.x = -Math.PI / 2;
            desk.position.y = -0.5;
            scene.add(desk);
        }

        function createCoverTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1400;
            const ctx = canvas.getContext('2d');

            // Cuero envejecido
            ctx.fillStyle = '#2b1a10';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Marco dorado grabado
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 12;
            ctx.strokeRect(60, 60, canvas.width - 120, canvas.height - 120);

            // Título
            ctx.fillStyle = '#f4ebd7';
            ctx.font = 'bold 56px "Cinzel", serif';
            ctx.textAlign = 'center';
            ctx.fillText("PALABRAS Y", canvas.width / 2, 520);
            ctx.fillText("FRASES PERDIDAS", canvas.width / 2, 600);

            ctx.font = 'italic 34px "Amiri", serif';
            ctx.fillStyle = '#d4af37';
            ctx.fillText("— Manuscrito —", canvas.width / 2, 720);

            return new THREE.CanvasTexture(canvas);
        }

        function createOpenBookTextures(title, bodyText) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1400;
            const ctx = canvas.getContext('2d');

            // Pergamino
            ctx.fillStyle = '#f4ebd7';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(90, 60, 30, 0.3)';
            ctx.lineWidth = 4;
            ctx.strokeRect(60, 60, canvas.width - 120, canvas.height - 120);

            ctx.fillStyle = '#7a2d10';
            ctx.font = 'bold 38px "Cinzel", serif';
            ctx.textAlign = 'center';
            ctx.fillText(title, canvas.width / 2, 180);

            ctx.fillStyle = '#2c1d11';
            ctx.font = 'italic 46px "Amiri", serif';

            const words = bodyText.split(' ');
            let line = '';
            let lines = [];
            let maxWidth = canvas.width - 240;

            for (let i = 0; i < words.length; i++) {
                let testLine = line + words[i] + ' ';
                if (ctx.measureText(testLine).width > maxWidth && i > 0) {
                    lines.push(line);
                    line = words[i] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            let startY = 600 - (lines.length * 30);
            for (let j = 0; j < lines.length; j++) {
                ctx.fillText(lines[j], canvas.width / 2, startY + (j * 80));
            }

            return new THREE.CanvasTexture(canvas);
        }

        function createBookModels() {
            // 1. Libro Cerrado
            const closedGeo = new THREE.BoxGeometry(4.8, 6.4, 0.6);
            const closedMat = new THREE.MeshStandardMaterial({
                map: createCoverTexture(),
                roughness: 0.7
            });
            closedBookMesh = new THREE.Mesh(closedGeo, closedMat);
            closedBookMesh.rotation.x = -Math.PI / 2;
            closedBookMesh.position.set(0, 0, 0);
            scene.add(closedBookMesh);

            // 2. Libro Abierto (Dos páginas desplegadas sobre la mesa)
            const openGroup = new THREE.Group();
            
            // Lomo central simulado
            const spineGeo = new THREE.BoxGeometry(4.8, 6.4, 0.2);
            const spineMat = new THREE.MeshStandardMaterial({ color: 0x2b1a10, roughness: 0.8 });
            const spine = new THREE.Mesh(spineGeo, spineMat);
            spine.rotation.x = -Math.PI / 2;
            openGroup.add(spine);

            // Página Izquierda (Fija con marca decorativa)
            const leftGeo = new THREE.PlaneGeometry(2.3, 5.8);
            const leftMat = new THREE.MeshStandardMaterial({
                map: createOpenBookTextures("EL MANUSCRITO", "Selecciona tu idioma en el menú flotante para comenzar el viaje."),
                roughness: 0.85
            });
            const leftPage = new THREE.Mesh(leftGeo, leftMat);
            leftPage.rotation.x = -Math.PI / 2;
            leftPage.position.set(-1.25, 0.02, 0);
            openGroup.add(leftPage);

            // Página Derecha (Dinámica con frases aleatorias)
            const rightGeo = new THREE.PlaneGeometry(2.3, 5.8);
            const rightMat = new THREE.MeshStandardMaterial({
                map: createOpenBookTextures("PENSAMIENTO", "Haz clic en Siguiente para mostrar una frase aleatoria."),
                roughness: 0.85
            });
            window.rightPageMesh = new THREE.Mesh(rightGeo, rightMat);
            window.rightPageMesh.rotation.x = -Math.PI / 2;
            window.rightPageMesh.position.set(1.25, 0.02, 0);
            openGroup.add(window.rightPageMesh);

            openGroup.visible = false;
            window.openBookGroup = openGroup;
            scene.add(openGroup);
        }

        function openBook() {
            currentStep = 1;
            closedBookMesh.visible = false;
            window.openBookGroup.visible = true;
            document.getElementById('langMenu').style.display = 'grid';
            document.getElementById('pageIndicator').textContent = "Índice de Idiomas";
            document.getElementById('hudSubtitle').textContent = "Elige tu idioma preferido";
        }

        function closeBook() {
            currentStep = 0;
            closedBookMesh.visible = true;
            window.openBookGroup.visible = false;
            document.getElementById('langMenu').style.display = 'none';
            document.getElementById('pageIndicator').textContent = "Libro Cerrado";
            document.getElementById('hudSubtitle').textContent = "Haz clic sobre la portada del libro para abrirlo";
        }

        function nextStep() {
            if (currentStep === 0) {
                openBook();
            } else {
                // Generar frase aleatoria en el idioma actual
                const list = phrasesDB[selectedLang] || phrasesDB['es'];
                const randomPhrase = list[Math.floor(Math.random() * list.length)];

                window.rightPageMesh.material.map = createOpenBookTextures(`PENSAMIENTO (${selectedLang.toUpperCase()})`, randomPhrase);
                window.rightPageMesh.material.needsUpdate = true;

                currentStep++;
                document.getElementById('pageIndicator').textContent = `Página (${currentStep - 1})`;
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                if (currentStep === 1) {
                    document.getElementById('langMenu').style.display = 'grid';
                    document.getElementById('pageIndicator').textContent = "Índice de Idiomas";
                }
            } else {
                closeBook();
            }
        }

        function selectLanguage(lang) {
            selectedLang = lang;
            document.getElementById('langMenu').style.display = 'none';

            const list = phrasesDB[selectedLang] || phrasesDB['es'];
            const randomPhrase = list[Math.floor(Math.random() * list.length)];

            window.rightPageMesh.material.map = createOpenBookTextures(`PENSAMIENTO (${selectedLang.toUpperCase()})`, randomPhrase);
            window.rightPageMesh.material.needsUpdate = true;

            currentStep = 2;
            document.getElementById('pageIndicator').textContent = "Página (1)";
            document.getElementById('hudSubtitle').textContent = "Pasa la página para descubrir una nueva frase aleatoria";
        }

        function onDocumentClick(event) {
            if (currentStep === 0) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(closedBookMesh);

                if (intersects.length > 0) {
                    openBook();
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
