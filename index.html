<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palabras y frases perdidas | Manuscrito</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0c0705;
            color: #2c221e;
            font-family: 'Amiri', serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* HUD Superior */
        .hud-header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            background: rgba(244, 235, 215, 0.92);
            border: 1px solid #5a3c1e;
            padding: 8px 25px;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .hud-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: #3b2613;
            letter-spacing: 2px;
        }
        .hud-header p {
            font-size: 0.75rem;
            color: #7a2d10;
            font-style: italic;
        }

        /* Controles de Navegación */
        .page-nav {
            position: absolute;
            bottom: 25px;
            right: 30px;
            z-index: 10;
            display: flex;
            gap: 12px;
        }
        .nav-btn {
            background: #f4ebd7;
            border: 1px solid #5a3c1e;
            color: #3b2613;
            padding: 10px 20px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            border-radius: 3px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        .nav-btn:hover {
            background: #7a2d10;
            color: #f4ebd7;
        }

        .page-indicator {
            position: absolute;
            bottom: 25px;
            left: 30px;
            z-index: 10;
            background: rgba(244, 235, 215, 0.92);
            border: 1px solid #5a3c1e;
            padding: 10px 20px;
            border-radius: 4px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            color: #3b2613;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div class="hud-header">
        <h1>PALABRAS Y FRASES PERDIDAS</h1>
        <p id="hudSubtitle">Haz clic sobre la portada del libro para abrirlo</p>
    </div>

    <div class="page-indicator" id="pageIndicator">Libro Cerrado</div>

    <div class="page-nav">
        <button class="nav-btn" onclick="prevStep()">Cerrar / Anterior</button>
        <button class="nav-btn" onclick="nextStep()">Siguiente Página</button>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const phrasesDB = {
            es: [
                "El destino no se cruza en nuestro camino; se dibuja con cada silencio que decidimos no romper.",
                "Toda geometría es un intento del alma por ordenar el caos que habita en las estrellas.",
                "Hay líneas invisibles que atan nuestros pasos a promesas que nunca llegamos a pronunciar.",
                "El compás del tiempo mide círculos cerrados donde el pasado y el futuro siempre se besan.",
                "Perderse en la niebla es el precio obligado para encontrar el centro exacto de uno mismo."
            ],
            en: [
                "Destiny does not cross our path; it is drawn with every silence we choose not to break.",
                "All geometry is the soul's attempt to order the chaos dwelling within the stars.",
                "There are invisible lines binding our steps to promises we never manage to voice."
            ],
            fr: [
                "Le destin ne croise pas notre chemin ; il se dessine avec chaque silence que nous choisissons de ne pas briser.",
                "Toute géométrie est une tentative de l'âme pour ordonner le chaos qui habite les étoiles."
            ],
            de: [
                "Das Schicksal kreuzt nicht unseren Weg; es wird mit jedem Schweigen gezeichnet, das wir nicht zu brechen wagen.",
                "Jede Geometrie ist der Versuch der Seele, das Chaos in den Sternen zu ordnen."
            ],
            ru: [
                "Судьба не пересекает наш путь; она рисуется каждым молчанием, которое мы решаем не нарушать.",
                "Всякая геометрия — это попытка души упорядочить хаос, живущий в звездах."
            ],
            hi: [
                "भाग्य हमारे रास्ते को पार नहीं करता; इसे हर उस सन्नाटे से खींचा जाता है जिसे हम न तोड़ने का फैसला करते हैं।",
                "हर ज्यामिति आत्मा का तारों के भीतर बसने वाले caos को व्यवस्थित करने का प्रयास है।"
            ],
            ja: [
                "運命は私たちの道を横切るのではなく、私たちが破らないと決めた沈黙ごとに描かれます。",
                "すべての幾何学は、星の中に宿るカオスを秩序づけようとする魂の試みです。"
            ],
            pt: [
                "O destino não cruza o nosso caminho; desenha-se com cada silêncio que decidimos não quebrar.",
                "Toda geometria é uma tentativa da alma de ordenar o caos que habita nas estrelas."
            ],
            ar: [
                "لا يتقاطع القدر مع طريقنا؛ بل يُرسم بكل صمت نختار عدم كسره.",
                "كل هندسة هي محاولة للروح لترتيب الفوضى التي تسكن النجوم."
            ],
            fa: [
                "سرنوشت مسیر ما را قطع نمی‌کند؛ بلکه با هر سکوتی که تصمیم می‌گیریم نشکنیم، ترسیم می‌شود.",
                "هر هندسه‌ای تلاش روح برای نظم بخشیدن به آشفتگی درون ستارگان است."
            ]
        };

        const languagesList = [
            { code: 'es', label: 'Español' },
            { code: 'en', label: 'English' },
            { code: 'fr', label: 'Français' },
            { code: 'de', label: 'Deutsch' },
            { code: 'ru', label: 'Русский' },
            { code: 'hi', label: 'हिन्दी' },
            { code: 'ja', label: '日本語' },
            { code: 'pt', label: 'Português' },
            { code: 'ar', label: 'العربية' },
            { code: 'fa', label: 'فارسی' }
        ];

        let scene, camera, renderer, closedBookMesh, openGroup;
        let currentStep = 0; // 0: Cerrado, 1: Índice de idiomas integrado, 2+: Frases
        let selectedLang = 'es';
        let raycaster, mouse;
        let rightPageMaterial, leftPageMaterial;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0c0705);

            camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 11, 4.5);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Iluminación cálida estilo vela / estudio
            const ambient = new THREE.AmbientLight(0xfff3e0, 1.3);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffeed1, 1.5);
            sun.position.set(3, 10, 4);
            sun.castShadow = true;
            scene.add(sun);

            createDesk();
            createBookModels();

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onDocumentClick);

            animate();
        }

        function createDesk() {
            const deskGeo = new THREE.PlaneGeometry(35, 35);
            const deskMat = new THREE.MeshStandardMaterial({
                color: 0x160d07,
                roughness: 0.9,
                metalness: 0.05
            });
            const desk = new THREE.Mesh(deskGeo, deskMat);
            desk.rotation.x = -Math.PI / 2;
            desk.position.y = -0.5;
            scene.add(desk);
        }

        // Textura realista de cuero envejecido con relieve y grabado dorado
        function createCoverTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1400;
            const ctx = canvas.getContext('2d');

            // Fondo de cuero oscuro con textura irregular de grano y desgaste
            ctx.fillStyle = '#22140b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sutiles manchas de envejecimiento
            for (let i = 0; i < 4000; i++) {
                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;
                let radius = Math.random() * 2.5;
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(15, 8, 4, 0.3)' : 'rgba(55, 35, 20, 0.2)';
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Marco doble dorado con efecto repujado
            ctx.strokeStyle = '#c5a059';
            ctx.lineWidth = 10;
            ctx.strokeRect(60, 60, canvas.width - 120, canvas.height - 120);

            ctx.strokeStyle = '#8a6e34';
            ctx.lineWidth = 3;
            ctx.strokeRect(76, 76, canvas.width - 152, canvas.height - 152);

            // Esquinas ornamentales simuladas
            ctx.fillStyle = '#c5a059';
            ctx.fillRect(55, 55, 30, 30);
            ctx.fillRect(canvas.width - 85, 55, 30, 30);
            ctx.fillRect(55, canvas.height - 85, 30, 30);
            ctx.fillRect(canvas.width - 85, canvas.height - 85, 30, 30);

            // Título central con tipografía clásica
            ctx.fillStyle = '#f4ebd7';
            ctx.font = 'bold 54px "Cinzel", serif';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 10;
            ctx.fillText("PALABRAS Y", canvas.width / 2, 520);
            ctx.fillText("FRASES PERDIDAS", canvas.width / 2, 600);

            ctx.shadowBlur = 0;
            ctx.font = 'italic 32px "Amiri", serif';
            ctx.fillStyle = '#d4af37';
            ctx.fillText("— Manuscrito de Colección —", canvas.width / 2, 720);

            return new THREE.CanvasTexture(canvas);
        }

        // Textura base de pergamino artesanal con fibras y bordes tostados
        function createPergamentTexture(title, bodyLines, isIndex = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1400;
            const ctx = canvas.getContext('2d');

            // Color base de papel pergamino antiguo
            ctx.fillStyle = '#f4ebd7';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Fibras sutiles de papel antiguo
            for (let i = 0; i < 2500; i++) {
                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(180, 160, 130, 0.15)' : 'rgba(90, 60, 30, 0.08)';
                ctx.fillRect(x, y, 2, 1);
            }

            // Viñeta oscura en los bordes y lomo (efecto libro real)
            const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 350, canvas.width/2, canvas.height/2, 850);
            grad.addColorStop(0, 'rgba(244, 235, 215, 0)');
            grad.addColorStop(1, 'rgba(100, 70, 40, 0.35)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Marco elegante del manuscrito
            ctx.strokeStyle = 'rgba(90, 60, 30, 0.45)';
            ctx.lineWidth = 4;
            ctx.strokeRect(60, 60, canvas.width - 120, canvas.height - 120);

            // Título de la página
            ctx.fillStyle = '#7a2d10';
            ctx.font = 'bold 36px "Cinzel", serif';
            ctx.textAlign = 'center';
            ctx.fillText(title, canvas.width / 2, 160);

            // Línea divisoria decorativa
            ctx.strokeStyle = '#7a2d10';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2 - 120, 195);
            ctx.lineTo(canvas.width / 2 + 120, 195);
            ctx.stroke();

            if (isIndex) {
                // Dibujar botones de idioma directamente sobre la página del libro 3D
                // (Se renderizan en el canvas para que sigan la misma inclinación del libro)
                let startY = 260;
                let colWidth = 380;
                let rowHeight = 85;

                languagesList.forEach((lang, index) => {
                    let col = index % 2;
                    let row = Math.floor(index / 2);
                    let x = 140 + (col * (colWidth + 40));
                    let y = startY + (row * rowHeight);

                    // Caja del botón en el pergamino
                    ctx.fillStyle = '#5a3c1e';
                    ctx.fillRect(x, y, colWidth, 65);
                    ctx.strokeStyle = '#3b2213';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x, y, colWidth, 65);

                    // Texto del idioma
                    ctx.fillStyle = '#f4ebd7';
                    ctx.font = 'bold 28px "Cinzel", serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(lang.label.toUpperCase(), x + (colWidth / 2), y + 42);
                });

                ctx.fillStyle = '#4a3421';
                ctx.font = 'italic 26px "Amiri", serif';
                ctx.fillText("Haz clic en tu idioma para comenzar la lectura", canvas.width / 2, canvas.height - 100);

            } else {
                // Cuerpo de texto de la frase literaria
                ctx.fillStyle = '#2c1d11';
                ctx.font = 'italic 46px "Amiri", serif';
                ctx.textAlign = 'center';

                let words = bodyLines.split(' ');
                let line = '';
                let lines = [];
                let maxWidth = canvas.width - 240;

                for (let i = 0; i < words.length; i++) {
                    let testLine = line + words[i] + ' ';
                    if (ctx.measureText(testLine).width > maxWidth && i > 0) {
                        lines.push(line);
                        line = words[i] + ' ';
                    } else {
                        line = testLine;
                    }
                }
                lines.push(line);

                let startY = 580 - (lines.length * 35);
                for (let j = 0; j < lines.length; j++) {
                    ctx.fillText(lines[j], canvas.width / 2, startY + (j * 80));
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.generateMipmaps = true;
            return texture;
        }

        function createBookModels() {
            // 1. Libro Cerrado con la tapa realista de cuero envejecido
            const closedGeo = new THREE.BoxGeometry(4.8, 6.4, 0.6);
            const closedMat = new THREE.MeshStandardMaterial({
                map: createCoverTexture(),
                roughness: 0.65,
                metalness: 0.1
            });
            closedBookMesh = new THREE.Mesh(closedGeo, closedMat);
            closedBookMesh.rotation.x = -Math.PI / 2;
            closedBookMesh.position.set(0, 0, 0);
            scene.add(closedBookMesh);

            // 2. Libro Abierto (Con texturas de pergamino puro integradas en 3D)
            openGroup = new THREE.Group();
            
            // Lomo central
            const spineGeo = new THREE.BoxGeometry(4.8, 6.4, 0.2);
            const spineMat = new THREE.MeshStandardMaterial({ color: 0x22140b, roughness: 0.8 });
            const spine = new THREE.Mesh(spineGeo, spineMat);
            spine.rotation.x = -Math.PI / 2;
            openGroup.add(spine);

            // Página Izquierda (Índice de Idiomas integrado con la misma inclinación)
            const leftGeo = new THREE.PlaneGeometry(2.3, 5.8);
            leftPageMaterial = new THREE.MeshStandardMaterial({
                map: createPergamentTexture("SELECCIONA TU IDIOMA", "", true),
                roughness: 0.85
            });
            const leftPage = new THREE.Mesh(leftGeo, leftPageMaterial);
            leftPage.rotation.x = -Math.PI / 2;
            leftPage.position.set(-1.25, 0.02, 0);
            openGroup.add(leftPage);

            // Página Derecha (Frases aleatorias)
            const rightGeo = new THREE.PlaneGeometry(2.3, 5.8);
            rightPageMaterial = new THREE.MeshStandardMaterial({
                map: createPergamentTexture("MANUSCRITO", "Pulsa 'Siguiente Página' para revelar la primera reflexión."),
                roughness: 0.85
            });
            window.rightPageMesh = new THREE.Mesh(rightGeo, rightPageMaterial);
            window.rightPageMesh.rotation.x = -Math.PI / 2;
            window.rightPageMesh.position.set(1.25, 0.02, 0);
            openGroup.add(window.rightPageMesh);

            openGroup.visible = false;
            scene.add(openGroup);
        }

        function openBook() {
            currentStep = 1;
            closedBookMesh.visible = false;
            openGroup.visible = true;
            document.getElementById('pageIndicator').textContent = "Índice de Idiomas";
            document.getElementById('hudSubtitle').textContent = "Selecciona tu idioma directamente sobre el pergamino";
        }

        function closeBook() {
            currentStep = 0;
            closedBookMesh.visible = true;
            openGroup.visible = false;
            document.getElementById('pageIndicator').textContent = "Libro Cerrado";
            document.getElementById('hudSubtitle').textContent = "Haz clic sobre la portada del libro para abrirlo";
        }

        function nextStep() {
            if (currentStep === 0) {
                openBook();
            } else {
                // Obtener frase aleatoria del idioma seleccionado
                const list = phrasesDB[selectedLang] || phrasesDB['es'];
                const randomPhrase = list[Math.floor(Math.random() * list.length)];

                window.rightPageMesh.material.map = createPergamentTexture(`REFLEXIÓN (${selectedLang.toUpperCase()})`, randomPhrase, false);
                window.rightPageMesh.material.needsUpdate = true;

                currentStep++;
                document.getElementById('pageIndicator').textContent = `Página (${currentStep - 1})`;
                document.getElementById('hudSubtitle').textContent = "Pasa la página para descubrir una nueva frase aleatoria";
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                if (currentStep === 1) {
                    document.getElementById('pageIndicator').textContent = "Índice de Idiomas";
                }
            } else {
                closeBook();
            }
        }

        // Detección de clics en los botones de idiomas dibujados sobre la página 3D izquierda
        function onDocumentClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            if (currentStep === 0) {
                const intersects = raycaster.intersectObject(closedBookMesh);
                if (intersects.length > 0) {
                    openBook();
                }
            } else if (currentStep === 1) {
                // Intersectar con la página izquierda para calcular qué idioma pulsó el usuario sobre el pergamino
                const intersects = raycaster.intersectObjects(openGroup.children);
                if (intersects.length > 0) {
                    let uv = intersects[0].uv;
                    if (uv) {
                        // Mapeo de coordenadas UV de la página izquierda a la rejilla de 2 columnas x 5 filas
                        // UV x va de 0 a 1 (mitad izquierda de la textura), y va de 0 a 1
                        let localX = uv.x * 1024;
                        let localY = (1.0 - uv.y) * 1400; // Invertido en Canvas

                        let startY = 260;
                        let colWidth = 380;
                        let rowHeight = 85;

                        languagesList.forEach((lang, index) => {
                            let col = index % 2;
                            let row = Math.floor(index / 2);
                            let x = 140 + (col * (colWidth + 40));
                            let y = startY + (row * rowHeight);

                            if (localX >= x && localX <= x + colWidth && localY >= y && localY <= y + 65) {
                                selectLanguage(lang.code);
                            }
                        });
                    }
                }
            }
        }

        function selectLanguage(lang) {
            selectedLang = lang;

            const list = phrasesDB[selectedLang] || phrasesDB['es'];
            const randomPhrase = list[Math.floor(Math.random() * list.length)];

            window.rightPageMesh.material.map = createPergamentTexture(`REFLEXIÓN (${selectedLang.toUpperCase()})`, randomPhrase, false);
            window.rightPageMesh.material.needsUpdate = true;

            currentStep = 2;
            document.getElementById('pageIndicator').textContent = "Página (1)";
            document.getElementById('hudSubtitle').textContent = `Idioma seleccionado: ${selectedLang.toUpperCase()}. Pasa página para más frases.`;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
