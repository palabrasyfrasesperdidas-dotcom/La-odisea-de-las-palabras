<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palabras y frases perdidas | La odisea de las palabras</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0c0705;
            color: #2c221e;
            font-family: 'Amiri', serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* HUD Superior */
        .hud-header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            background: rgba(244, 235, 215, 0.92);
            border: 1px solid #5a3c1e;
            padding: 8px 25px;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .hud-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: #3b2613;
            letter-spacing: 2px;
        }
        .hud-header p {
            font-size: 0.75rem;
            color: #7a2d10;
            font-style: italic;
        }

        /* Controles de Navegación */
        .page-nav {
            position: absolute;
            bottom: 25px;
            right: 30px;
            z-index: 10;
            display: flex;
            gap: 12px;
        }
        .nav-btn {
            background: #f4ebd7;
            border: 1px solid #5a3c1e;
            color: #3b2613;
            padding: 10px 20px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            border-radius: 3px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        .nav-btn:hover {
            background: #7a2d10;
            color: #f4ebd7;
        }

        .page-indicator {
            position: absolute;
            bottom: 25px;
            left: 30px;
            z-index: 10;
            background: rgba(244, 235, 215, 0.92);
            border: 1px solid #5a3c1e;
            padding: 10px 20px;
            border-radius: 4px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            color: #3b2613;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .page-indicator:hover {
            background: #e6dabf;
        }
    </style>
</head>
<body>

    <div class="hud-header">
        <h1>PALABRAS Y FRASES PERDIDAS</h1>
        <p id="hudSubtitle">La odisea de las palabras — Haz clic sobre la portada para abrirlo</p>
    </div>

    <div class="page-indicator" id="pageIndicator" onclick="goToIndex()">Libro Cerrado</div>

    <div class="page-nav">
        <button class="nav-btn" onclick="prevPage()">Anterior</button>
        <button class="nav-btn" onclick="nextPage()">Siguiente Página</button>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const phrasesDB = {
            es: [
                "El destino no se cruza en nuestro camino; se dibuja con cada silencio que decidimos no romper.",
                "Toda geometría es un intento del alma por ordenar el caos que habita en las estrellas.",
                "Hay líneas invisibles que atan nuestros pasos a promesas que nunca llegamos a pronunciar.",
                "El compás del tiempo mide círculos cerrados donde el pasado y el futuro siempre se besan.",
                "Perderse en la niebla es el precio obligado para encontrar el centro exacto de uno mismo."
            ],
            en: [
                "Destiny does not cross our path; it is drawn with every silence we choose not to break.",
                "All geometry is the soul's attempt to order the chaos dwelling within the stars.",
                "There are invisible lines binding our steps to promises we never manage to voice."
            ],
            fr: [
                "Le destin ne croise pas notre chemin ; il se dessine avec chaque silence que nous choisissons de ne pas briser.",
                "Toute géométrie est une tentative de l'âme pour ordonner le chaos qui habite les étoiles."
            ],
            de: [
                "Das Schicksal kreuzt nicht unseren Weg; es wird mit jedem Schweigen gezeichnet, das wir nicht zu brechen wagen.",
                "Jede Geometrie ist der Versuch der Seele, das Chaos in den Sternen zu ordnen."
            ],
            ru: [
                "Судьба не пересекает наш путь; она рисуется каждым молчанием, которое мы решаем не нарушать.",
                "Всякая геометрия — это попытка души упорядочить хаос, живущий в звездах."
            ],
            hi: [
                "भाग्य हमारे रास्ते को पार नहीं करता; इसे हर उस सन्नाटे से खींचा जाता है जिसे हम न तोड़ने का फैसला करते हैं।",
                "हर ज्यामिति आत्मा का तारों के भीतर बसने वाले caos को व्यवस्थित करने का प्रयास है।"
            ],
            ja: [
                "運命は私たちの道を横切るのではなく、私たちが破らないと決めた沈黙ごとに描かれます。",
                "すべての幾何学は、星の中に宿るカオスを秩序づけようとする魂の試みです。"
            ],
            pt: [
                "O destino não cruza o nosso caminho; desenha-se com cada silêncio que decidimos não quebrar.",
                "Toda geometria é uma tentativa da alma de ordenar o caos que habita nas estrelas."
            ],
            ar: [
                "لا يتقاطع القدر مع طريقنا؛ بل يُرسم بكل صمت نختار عدم كسره.",
                "كل هندسة هي محاولة للروح لترتيب الفوضى التي تسكن النجوم."
            ],
            fa: [
                "سرنوشت مسیر ما را قطع نمی‌کند؛ بلکه با هر سکوتی که تصمیم می‌گیریم نشکنیم، ترسیم می‌شود.",
                "هر هندسه‌ای تلاش روح برای نظم بخشیدن به آشفتگی درون ستارگان است."
            ]
        };

        const languagesList = [
            { code: 'es', label: 'Español' },
            { code: 'en', label: 'English' },
            { code: 'fr', label: 'Français' },
            { code: 'de', label: 'Deutsch' },
            { code: 'ru', label: 'Русский' },
            { code: 'hi', label: 'हिन्दी' },
            { code: 'ja', label: '日本語' },
            { code: 'pt', label: 'Português' },
            { code: 'ar', label: 'العربية' },
            { code: 'fa', label: 'فارسی' }
        ];

        let scene, camera, renderer;
        let bookClosed, bookOpenMesh;
        let openBookMat;
        let turningPageMesh, turningPageMat;
        
        let currentState = 0; // 0: Cerrado, 1: Índice, 2+: Páginas
        let selectedLang = 'es';
        let currentPhraseIndex = 0;
        
        let isAnimating = false;
        let currentRotation = 0;
        let targetRotation = 0;

        let raycaster, mouse;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0c0705);

            camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 11, 4.5);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xfff3e0, 1.4);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffeed1, 1.6);
            sun.position.set(3, 10, 4);
            sun.castShadow = true;
            scene.add(sun);

            createDesk();
            createBook();

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onDocumentClick);

            animate();
        }

        function createDesk() {
            const deskGeo = new THREE.PlaneGeometry(35, 35);
            const deskMat = new THREE.MeshStandardMaterial({ color: 0x160d07, roughness: 0.9 });
            const desk = new THREE.Mesh(deskGeo, deskMat);
            desk.rotation.x = -Math.PI / 2;
            desk.position.y = -0.5;
            scene.add(desk);
        }

        function createCoverTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1400;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#1c241e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < 5000; i++) {
                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(12, 18, 14, 0.4)' : 'rgba(45, 60, 48, 0.2)';
                ctx.fillRect(x, y, 2, 2);
            }

            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 8;
            ctx.strokeRect(60, 60, canvas.width - 120, canvas.height - 120);

            ctx.strokeStyle = '#997a25';
            ctx.lineWidth = 3;
            ctx.strokeRect(76, 76, canvas.width - 152, canvas.height - 152);

            ctx.fillStyle = '#d4af37';
            ctx.fillRect(55, 55, 45, 45);
            ctx.fillRect(canvas.width - 100, 55, 45, 45);
            ctx.fillRect(55, canvas.height - 100, 45, 45);
            ctx.fillRect(canvas.width - 100, canvas.height - 100, 45, 45);

            ctx.fillStyle = '#131915';
            ctx.beginPath();
            ctx.ellipse(canvas.width / 2, 560, 340, 140, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 6;
            ctx.stroke();

            // Título ligeramente superior según tu petición original
            ctx.fillStyle = '#f4ebd7';
            ctx.font = 'bold 52px "Cinzel", serif';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
            ctx.shadowBlur = 8;
            ctx.fillText("PALABRAS Y", canvas.width / 2, 530);
            ctx.fillText("FRASES PERDIDAS", canvas.width / 2, 595);

            ctx.shadowBlur = 0;
            ctx.font = 'italic 36px "Amiri", serif';
            ctx.fillStyle = '#d4af37';
            ctx.fillText("La odisea de las palabras", canvas.width / 2, 760);

            const texture = new THREE.CanvasTexture(canvas);
            texture.generateMipmaps = false;
            texture.minFilter = THREE.LinearFilter;
            return texture;
        }

        // Genera la doble página abierta combinada en un solo lienzo de 2048x1400 (Izquierda: Índice/Texto, Derecha: Texto/Lectura)
        function createOpenBookTexture(leftTitle, leftBody, rightTitle, rightBody, isIndex = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1400;
            const ctx = canvas.getContext('2d');

            // --- PÁGINA IZQUIERDA (0 a 1024) ---
            ctx.fillStyle = '#f2ebd9';
            ctx.fillRect(0, 0, 1024, 1400);

            for (let i = 0; i < 2000; i++) {
                let x = Math.random() * 1024;
                let y = Math.random() * 1400;
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(190, 170, 140, 0.25)' : 'rgba(110, 80, 45, 0.1)';
                ctx.fillRect(x, y, 2, 1);
            }

            let gradLeft = ctx.createRadialGradient(512, 700, 350, 512, 700, 850);
            gradLeft.addColorStop(0, 'rgba(242, 235, 217, 0)');
            gradLeft.addColorStop(1, 'rgba(110, 80, 45, 0.35)');
            ctx.fillStyle = gradLeft;
            ctx.fillRect(0, 0, 1024, 1400);

            ctx.strokeStyle = 'rgba(90, 60, 30, 0.5)';
            ctx.lineWidth = 4;
            ctx.strokeRect(60, 60, 1024 - 120, 1400 - 120);

            // Sombra del lomo centro izquierdo
            let spineGradL = ctx.createLinearGradient(960, 0, 1024, 0);
            spineGradL.addColorStop(0, 'rgba(0,0,0,0)');
            spineGradL.addColorStop(1, 'rgba(60,40,20,0.25)');
            ctx.fillStyle = spineGradL;
            ctx.fillRect(960, 60, 64, 1280);

            // Contenido Página Izquierda
            ctx.fillStyle = '#7a2d10';
            ctx.font = 'bold 36px "Cinzel", serif';
            ctx.textAlign = 'center';
            ctx.fillText(leftTitle, 512, 160);

            ctx.strokeStyle = '#7a2d10';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(512 - 120, 195);
            ctx.lineTo(512 + 120, 195);
            ctx.stroke();

            if (isIndex) {
                let startY = 240;
                let colWidth = 380;
                let rowHeight = 78;

                languagesList.forEach((lang, index) => {
                    let col = index % 2;
                    let row = Math.floor(index / 2);
                    let x = 110 + (col * (colWidth + 40));
                    let y = startY + (row * rowHeight);

                    // Color de los botones de idioma diferenciado de la tapa
                    ctx.fillStyle = '#3e5c46'; 
                    ctx.fillRect(x, y, colWidth, 60);
                    ctx.strokeStyle = '#223327';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x, y, colWidth, 60);

                    ctx.fillStyle = '#f4ebd7';
                    ctx.font = 'bold 24px "Cinzel", serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(lang.label.toUpperCase(), x + (colWidth / 2), y + 38);
                });

                ctx.fillStyle = '#3b2613';
                ctx.font = 'italic 24px "Amiri", serif';
                ctx.fillText("Selecciona tu idioma en el índice", 512, 1300);
            } else {
                renderTextBody(ctx, leftBody, 512, 580);
            }


            // --- PÁGINA DERECHA (1024 a 2048) ---
            ctx.fillStyle = '#f2ebd9';
            ctx.fillRect(1024, 0, 1024, 1400);

            for (let i = 0; i < 2000; i++) {
                let x = 1024 + Math.random() * 1024;
                let y = Math.random() * 1400;
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(190, 170, 140, 0.25)' : 'rgba(110, 80, 45, 0.1)';
                ctx.fillRect(x, y, 2, 1);
            }

            let gradRight = ctx.createRadialGradient(1536, 700, 350, 1536, 700, 850);
            gradRight.addColorStop(0, 'rgba(242, 235, 217, 0)');
            gradRight.addColorStop(1, 'rgba(110, 80, 45, 0.35)');
            ctx.fillStyle = gradRight;
            ctx.fillRect(1024, 0, 1024, 1400);

            ctx.strokeStyle = 'rgba(90, 60, 30, 0.5)';
            ctx.lineWidth = 4;
            ctx.strokeRect(1024 + 60, 60, 1024 - 120, 1400 - 120);

            let spineGradR = ctx.createLinearGradient(1024, 0, 1088, 0);
            spineGradR.addColorStop(0, 'rgba(60,40,20,0.25)');
            spineGradR.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = spineGradR;
            ctx.fillRect(1024, 60, 64, 1280);

            // Contenido Página Derecha
            ctx.fillStyle = '#7a2d10';
            ctx.font = 'bold 36px "Cinzel", serif';
            ctx.textAlign = 'center';
            ctx.fillText(rightTitle, 1536, 160);

            ctx.strokeStyle = '#7a2d10';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(1536 - 120, 195);
            ctx.lineTo(1536 + 120, 195);
            ctx.stroke();

            renderTextBody(ctx, rightBody, 1536, 580);

            const texture = new THREE.CanvasTexture(canvas);
            texture.generateMipmaps = false;
            texture.minFilter = THREE.LinearFilter;
            return texture;
        }

        function renderTextBody(ctx, text, centerX, startY) {
            ctx.fillStyle = '#2c1d11';
            ctx.font = 'italic 40px "Amiri", serif';
            ctx.textAlign = 'center';

            if (!text) return;
            let words = text.split(' ');
            let line = '';
            let lines = [];
            let maxWidth = 800;

            for (let i = 0; i < words.length; i++) {
                let testLine = line + words[i] + ' ';
                if (ctx.measureText(testLine).width > maxWidth && i > 0) {
                    lines.push(line);
                    line = words[i] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            let initialY = startY - ((lines.length * 35) / 2);
            for (let j = 0; j < lines.length; j++) {
                ctx.fillText(lines[j], centerX, initialY + (j * 75));
            }
        }

        function createBook() {
            // Libro cerrado
            const closedGeo = new THREE.BoxGeometry(4.8, 6.4, 0.6);
            const closedMat = new THREE.MeshStandardMaterial({ map: createCoverTexture(), roughness: 0.65 });
            bookClosed = new THREE.Mesh(closedGeo, closedMat);
            bookClosed.rotation.x = -Math.PI / 2;
            scene.add(bookClosed);

            // Libro abierto unificado
            const openGeo = new THREE.PlaneGeometry(4.8, 5.8);
            openBookMat = new THREE.MeshStandardMaterial({ 
                map: createOpenBookTexture("SELECCIONA TU IDIOMA", "", "MANUSCRITO", "Selecciona un idioma en la página izquierda.", true), 
                roughness: 0.85 
            });
            bookOpenMesh = new THREE.Mesh(openGeo, openBookMat);
            bookOpenMesh.rotation.x = -Math.PI / 2;
            bookOpenMesh.position.set(0, 0.02, 0);
            bookOpenMesh.visible = false;
            scene.add(bookOpenMesh);

            // Hoja que gira
            const turningGeo = new THREE.PlaneGeometry(2.4, 5.8);
            turningGeo.translate(1.2, 0, 0); // Pivote en el lomo
            turningPageMat = new THREE.MeshStandardMaterial({ 
                map: createOpenBookTexture("", "", "", ""), 
                roughness: 0.85, 
                side: THREE.DoubleSide 
            });
            turningPageMesh = new THREE.Mesh(turningGeo, turningPageMat);
            turningPageMesh.rotation.x = -Math.PI / 2;
            turningPageMesh.position.set(0, 0.03, -2.9);
            turningPageMesh.visible = false;
            scene.add(turningPageMesh);
        }

        function openBookAnimation() {
            currentState = 1;
            bookClosed.visible = false;
            bookOpenMesh.visible = true;
            
            openBookMat.map = createOpenBookTexture("SELECCIONA TU IDIOMA", "", "MANUSCRITO", "Selecciona un idioma en la página izquierda.", true);
            openBookMat.map.needsUpdate = true;
            openBookMat.needsUpdate = true;

            document.getElementById('pageIndicator').textContent = "Índice de Idiomas";
            document.getElementById('hudSubtitle').textContent = "La odisea de las palabras — Selecciona tu idioma";
        }

        function goToIndex() {
            if (currentState > 0) {
                currentState = 1;
                openBookMat.map = createOpenBookTexture("SELECCIONA TU IDIOMA", "", "MANUSCRITO", "Selecciona un idioma en la página izquierda.", true);
                openBookMat.map.needsUpdate = true;
                openBookMat.needsUpdate = true;

                document.getElementById('pageIndicator').textContent = "Índice de Idiomas";
                document.getElementById('hudSubtitle').textContent = "La odisea de las palabras — Selecciona tu idioma";
            }
        }

        function nextPage() {
            if (currentState === 0) {
                openBookAnimation();
            } else if (currentState === 1) {
                selectLanguage('es');
            } else if (!isAnimating) {
                triggerPageTurn(true);
            }
        }

        function prevPage() {
            if (currentState > 2 && !isAnimating) {
                triggerPageTurn(false);
            } else if (currentState === 2 || currentState === 1) {
                goToIndex();
            }
        }

        function triggerPageTurn(forward) {
            isAnimating = true;
            const list = phrasesDB[selectedLang] || phrasesDB['es'];

            if (forward) {
                currentPhraseIndex = (currentPhraseIndex + 1) % list.length;
                currentState++;
            } else {
                currentPhraseIndex = (currentPhraseIndex - 1 + list.length) % list.length;
                currentState--;
            }

            let phrase = list[currentPhraseIndex];
            turningPageMat.map = createOpenBookTexture(`REFLEXIÓN (${selectedLang.toUpperCase()})`, phrase, `REFLEXIÓN (${selectedLang.toUpperCase()})`, phrase);
            turningPageMat.map.needsUpdate = true;
            turningPageMat.needsUpdate = true;

            turningPageMesh.visible = true;
            currentRotation = 0;
            targetRotation = forward ? -Math.PI : Math.PI;
        }

        function onDocumentClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            if (currentState === 0) {
                const intersects = raycaster.intersectObject(bookClosed);
                if (intersects.length > 0) {
                    openBookAnimation();
                }
            } else if (currentState === 1) {
                const intersects = raycaster.intersectObject(bookOpenMesh);
                if (intersects.length > 0) {
                    let uv = intersects[0].uv;
                    if (uv && uv.x <= 0.5) { // Clic en la mitad izquierda (índice)
                        let localX = uv.x * 2048;
                        let localY = (1.0 - uv.y) * 1400;

                        let startY = 240;
                        let colWidth = 380;
                        let rowHeight = 78;

                        languagesList.forEach((lang, index) => {
                            let col = index % 2;
                            let row = Math.floor(index / 2);
                            let x = 110 + (col * (colWidth + 40));
                            let y = startY + (row * rowHeight);

                            if (localX >= x && localX <= x + colWidth && localY >= y && localY <= y + 60) {
                                selectLanguage(lang.code);
                            }
                        });
                    }
                }
            }
        }

        function selectLanguage(lang) {
            selectedLang = lang;
            currentState = 2;
            currentPhraseIndex = 0;
            
            const list = phrasesDB[selectedLang] || phrasesDB['es'];
            openBookMat.map = createOpenBookTexture(`REFLEXIÓN (${selectedLang.toUpperCase()})`, list[0], `REFLEXIÓN (${selectedLang.toUpperCase()})`, list[0]);
            openBookMat.map.needsUpdate = true;
            openBookMat.needsUpdate = true;

            document.getElementById('pageIndicator').textContent = "Página (1)";
            document.getElementById('hudSubtitle').textContent = `Idioma: ${selectedLang.toUpperCase()} — Pasa página para continuar`;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isAnimating) {
                currentRotation += (targetRotation - currentRotation) * 0.12;
                turningPageMesh.rotation.y = currentRotation;

                if (Math.abs(targetRotation - currentRotation) < 0.01) {
                    isAnimating = false;
                    turningPageMesh.visible = false;
                    turningPageMesh.rotation.y = 0;
                    
                    const list = phrasesDB[selectedLang] || phrasesDB['es'];
                    let phrase = list[currentPhraseIndex];
                    openBookMat.map = createOpenBookTexture(`REFLEXIÓN (${selectedLang.toUpperCase()})`, phrase, `REFLEXIÓN (${selectedLang.toUpperCase()})`, phrase);
                    openBookMat.map.needsUpdate = true;
                    openBookMat.needsUpdate = true;
                    
                    document.getElementById('pageIndicator').textContent = `Página (${currentPhraseIndex + 1})`;
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
