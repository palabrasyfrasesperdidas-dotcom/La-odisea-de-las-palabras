<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 1: Geometría del Destino | El Libro de las Palabras</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@0,400;0,600;1,400&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0c0907;
            color: #2c221e;
            font-family: 'Amiri', serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Interfaz HUD flotante clásica */
        .hud-header {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            background: rgba(244, 235, 215, 0.9);
            border: 1px solid rgba(90, 60, 30, 0.4);
            padding: 10px 35px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
        }
        .hud-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: #3b2613;
            letter-spacing: 3px;
            font-weight: 600;
        }
        .hud-header p {
            font-size: 0.85rem;
            color: #61462a;
            margin-top: 2px;
            letter-spacing: 2px;
            font-style: italic;
        }

        .hud-instructions {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(244, 235, 215, 0.9);
            border: 1px solid rgba(90, 60, 30, 0.4);
            padding: 12px 25px;
            border-radius: 4px;
            font-size: 0.9rem;
            color: #4a3421;
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            letter-spacing: 1px;
        }

        /* Controles de página discretos y elegantes */
        .page-nav {
            position: absolute;
            bottom: 25px;
            right: 30px;
            z-index: 10;
            display: flex;
            gap: 12px;
        }
        .nav-btn {
            background: #f4ebd7;
            border: 1px solid #5a3c1e;
            color: #3b2613;
            padding: 10px 20px;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border-radius: 3px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        .nav-btn:hover:not(:disabled) {
            background: #7a2d10;
            color: #f4ebd7;
            border-color: #3b2613;
            box-shadow: 0 0 15px rgba(122, 45, 16, 0.5);
        }
        .nav-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .page-indicator {
            position: absolute;
            bottom: 25px;
            left: 30px;
            z-index: 10;
            background: rgba(244, 235, 215, 0.9);
            border: 1px solid rgba(90, 60, 30, 0.4);
            padding: 10px 20px;
            border-radius: 4px;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            color: #3b2613;
            letter-spacing: 2px;
            backdrop-filter: blur(6px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div class="hud-header">
        <h1>GEOMETRÍA DEL DESTINO</h1>
        <p>Bloque I · El Manuscrito de Tinta y Pergamino</p>
    </div>

    <div class="hud-instructions">
        Usa los botones inferiores o arrastra las esquinas de las páginas para pasar el folio.
    </div>

    <div class="page-indicator">
        Página <span id="currentPageNum">1</span> de <span id="totalPageNum">5</span>
    </div>

    <div class="page-nav">
        <button class="nav-btn" id="prevBtn" onclick="prevPage()">Anterior</button>
        <button class="nav-btn" id="nextBtn" onclick="nextPage()">Siguiente</button>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const phrases = [
            { id: 1, text: "El destino no se cruza en nuestro camino; se dibuja con cada silencio que decidimos no romper." },
            { id: 2, text: "Toda geometría es un intento del alma por ordenar el caos que habita en las estrellas." },
            { id: 3, text: "Hay líneas invisibles que atan nuestros pasos a promesas que nunca llegamos a pronunciar." },
            { id: 4, text: "El compás del tiempo mide círculos cerrados donde el pasado y el futuro siempre se besan." },
            { id: 5, text: "Perderse en la niebla es el precio obligado para encontrar el centro exacto de uno mismo." }
        ];

        let scene, camera, renderer;
        let bookGroup;
        let currentPage = 0;
        let pages = [];
        let isDragging = false;
        let dragProgress = 0;
        let targetProgress = 0;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0c0907);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, 9.5);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Iluminación cálida de estudio / vela
            const ambientLight = new THREE.AmbientLight(0xfff3e0, 1.0);
            scene.add(ambientLight);

            const deskLight = new THREE.DirectionalLight(0xffeed1, 1.4);
            deskLight.position.set(5, 10, 5);
            deskLight.castShadow = true;
            deskLight.shadow.mapSize.width = 2048;
            deskLight.shadow.mapSize.height = 2048;
            scene.add(deskLight);

            const subtleRim = new THREE.PointLight(0xd99b6c, 0.8, 10);
            subtleRim.position.set(-4, 3, -2);
            scene.add(subtleRim);

            createDeskSurface();
            createBook();

            window.addEventListener('resize', onWindowResize);
            setupInteractions();

            animate();
        }

        function createDeskSurface() {
            // Mesa de madera oscura antigua
            const deskGeo = new THREE.PlaneGeometry(30, 30);
            const deskMat = new THREE.MeshStandardMaterial({
                color: 0x1f140c,
                roughness: 0.7,
                metalness: 0.1
            });
            const desk = new THREE.Mesh(deskGeo, deskMat);
            desk.rotation.x = -Math.PI / 2;
            desk.position.y = -1.2;
            desk.receiveShadow = true;
            scene.add(desk);
        }

        function createTextTexture(text, pageNum) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1400;
            const ctx = canvas.getContext('2d');

            // Fondo pergamino envejecido texturizado
            ctx.fillStyle = '#f4ebd7';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sutil viñeta o textura de bordes tostados en el papel
            const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 400, canvas.width/2, canvas.height/2, 800);
            grad.addColorStop(0, 'rgba(244, 235, 215, 0)');
            grad.addColorStop(1, 'rgba(110, 80, 50, 0.25)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Márgenes del manuscrito
            ctx.strokeStyle = 'rgba(90, 60, 30, 0.35);';
            ctx.lineWidth = 4;
            ctx.strokeRect(60, 60, canvas.width - 120, canvas.height - 120);

            // Título / Cabecera de página
            ctx.fillStyle = '#7a2d10';
            ctx.font = 'bold 36px "Cinzel", serif';
            ctx.textAlign = 'center';
            ctx.fillText(`FRAGMENTO Nº ${pageNum}`, canvas.width / 2, 180);

            // Línea separadora decorativa
            ctx.strokeStyle = '#7a2d10';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2 - 100, 220);
            ctx.lineTo(canvas.width / 2 + 100, 220);
            ctx.stroke();

            // Cuerpo de texto (frase literaria centrada y poética)
            ctx.fillStyle = '#2c1d11';
            ctx.font.style = 'italic';
            ctx.font = 'italic 52px "Amiri", serif';
            ctx.textAlign = 'center';
            
            // Función de salto de línea automático (Word Wrap)
            const words = text.split(' ');
            let line = '';
            let lines = [];
            let maxWidth = canvas.width - 240;

            for (let i = 0; i < words.length; i++) {
                let testLine = line + words[i] + ' ';
                let metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && i > 0) {
                    lines.push(line);
                    line = words[i] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            let startY = 550 - (lines.length * 35);
            for (let j = 0; j < lines.length; j++) {
                ctx.fillText(lines[j], canvas.width / 2, startY + (j * 85));
            }

            // Número de página inferior
            ctx.font = '32px "Cinzel", serif';
            ctx.fillStyle = '#5a3c1e';
            ctx.fillText(`— ${pageNum} —`, canvas.width / 2, canvas.height - 120);

            const texture = new THREE.CanvasTexture(canvas);
            texture.generateMipmaps = true;
            return texture;
        }

        function createBook() {
            bookGroup = new THREE.Group();

            // Lomo y contraportada de cuero oscuro
            const coverGeo = new THREE.BoxGeometry(7.2, 5.2, 0.35);
            const coverMat = new THREE.MeshStandardMaterial({
                color: 0x3b2213,
                roughness: 0.85,
                metalness: 0.1
            });
            const cover = new THREE.Mesh(coverGeo, coverMat);
            cover.position.z = -0.15;
            cover.castShadow = true;
            cover.receiveShadow = true;
            bookGroup.add(cover);

            // Páginas interiores simuladas con volumen
            const blockGeo = new THREE.BoxGeometry(6.8, 4.8, 0.25);
            const blockMat = new THREE.MeshStandardMaterial({
                color: 0xe8dec7,
                roughness: 0.9
            });
            const pagesBlock = new THREE.Mesh(blockGeo, blockMat);
            pagesBlock.position.z = 0.03;
            pagesBlock.castShadow = true;
            bookGroup.add(pagesBlock);

            // Páginas físicas interactivas superiores
            // Dividimos en hojas con textura para cada frase
            phrases.forEach((phrase, index) => {
                const pageGeo = new THREE.PlaneGeometry(3.3, 4.6, 16, 16);
                // Ajustamos el origen de rotación al lomo (borde izquierdo de la página derecha)
                pageGeo.translate(1.65, 0, 0);

                const textureFront = createTextTexture(phrase.text, phrase.id);
                const textureBack = createTextTexture("El eco de las palabras perdidas...", phrase.id);

                const matFront = new THREE.MeshStandardMaterial({
                    map: textureFront,
                    roughness: 0.85,
                    side: THREE.FrontSide
                });
                const matBack = new THREE.MeshStandardMaterial({
                    map: textureBack,
                    roughness: 0.85,
                    side: THREE.BackSide
                });

                const pageMesh = new THREE.Mesh(pageGeo, [matFront, matBack]);
                pageMesh.position.set(-1.65, 0, 0.18 + (index * 0.005));
                pageMesh.castShadow = true;
                pageMesh.receiveShadow = true;

                bookGroup.add(pageMesh);
                pages.push(pageMesh);
            });

            scene.add(bookGroup);
        }

        function setupInteractions() {
            let startX = 0;
            window.addEventListener('pointerdown', (e) => {
                isDragging = true;
                startX = e.clientX;
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const delta = (e.clientX - startX) / window.innerWidth;
                targetProgress = Math.max(0, Math.min(phrases.length - 1, currentPage - delta * 2));
            });

            window.addEventListener('pointerup', () => {
                if (!isDragging) return;
                isDragging = false;
                currentPage = Math.round(targetProgress);
                targetProgress = currentPage;
                updatePageUI();
            });
        }

        function nextPage() {
            if (currentPage < phrases.length - 1) {
                currentPage++;
                targetProgress = currentPage;
                updatePageUI();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                targetProgress = currentPage;
                updatePageUI();
            }
        }

        function updatePageUI() {
            document.getElementById('currentPageNum').textContent = currentPage + 1;
            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage === phrases.length - 1;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Interpolación suave (Lerp) para el paso de página físico
            currentPage += (targetProgress - currentPage) * 0.1;

            pages.forEach((page, idx) => {
                if (idx < Math.floor(currentPage)) {
                    // Página ya pasada (doblada a la izquierda)
                    let diff = currentPage - idx;
                    let angle = -Math.PI * Math.min(1, diff);
                    page.rotation.y = angle;
                } else if (idx === Math.floor(currentPage)) {
                    // Página actual en transición o reposo
                    let progressFraction = currentPage - Math.floor(currentPage);
                    let angle = -Math.PI * progressFraction;
                    page.rotation.y = angle;
                } else {
                    // Páginas restantes en el lado derecho
                    page.rotation.y = 0;
                }
            });

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
