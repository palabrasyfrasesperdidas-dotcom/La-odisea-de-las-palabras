<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palabras y frases perdidas | El Manuscrito</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0705;
            color: #2c221e;
            font-family: 'Amiri', serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Interfaz HUD flotante */
        .hud-header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            background: rgba(244, 235, 215, 0.9);
            border: 1px solid rgba(90, 60, 30, 0.4);
            padding: 8px 30px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
        }
        .hud-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: #3b2613;
            letter-spacing: 3px;
        }
        .hud-header p {
            font-size: 0.8rem;
            color: #61462a;
            font-style: italic;
        }

        /* Controles de navegación inferiores */
        .page-nav {
            position: absolute;
            bottom: 25px;
            right: 30px;
            z-index: 10;
            display: flex;
            gap: 12px;
        }
        .nav-btn {
            background: #f4ebd7;
            border: 1px solid #5a3c1e;
            color: #3b2613;
            padding: 10px 22px;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border-radius: 3px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        .nav-btn:hover {
            background: #7a2d10;
            color: #f4ebd7;
            border-color: #3b2613;
        }

        .page-indicator {
            position: absolute;
            bottom: 25px;
            left: 30px;
            z-index: 10;
            background: rgba(244, 235, 215, 0.9);
            border: 1px solid rgba(90, 60, 30, 0.4);
            padding: 10px 20px;
            border-radius: 4px;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            color: #3b2613;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        /* Capa HTML interactiva para elementos complejos como el índice de idiomas */
        .interactive-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .language-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            pointer-events: auto;
            background: rgba(244, 235, 215, 0.95);
            border: 2px solid #5a3c1e;
            padding: 25px;
            border-radius: 6px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            max-width: 500px;
            text-align: center;
            display: none;
        }
        .language-grid h3 {
            grid-column: span 2;
            font-family: 'Cinzel', serif;
            color: #7a2d10;
            margin-bottom: 12px;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
        .lang-btn {
            background: #5a3c1e;
            color: #f4ebd7;
            border: none;
            padding: 8px 14px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 1px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .lang-btn:hover {
            background: #7a2d10;
            color: #fff;
            box-shadow: 0 0 10px rgba(122,45,16,0.5);
        }
    </style>
</head>
<body>

    <div class="hud-header">
        <h1>PALABRAS Y FRASES PERDIDAS</h1>
        <p>Manuscrito Abierto sobre Mesa de Madera</p>
    </div>

    <div class="page-indicator" id="pageIndicator">Portada</div>

    <div class="page-nav">
        <button class="nav-btn" onclick="prevStep()">Anterior</button>
        <button class="nav-btn" onclick="nextStep()">Siguiente / Pasar Página</button>
    </div>

    <div class="interactive-overlay">
        <div class="language-grid" id="langMenu">
            <h3>SELECCIONA TU IDIOMA</h3>
            <button class="lang-btn" onclick="selectLanguage('es')">Español</button>
            <button class="lang-btn" onclick="selectLanguage('en')">English</button>
            <button class="lang-btn" onclick="selectLanguage('fr')">Français</button>
            <button class="lang-btn" onclick="selectLanguage('de')">Deutsch</button>
            <button class="lang-btn" onclick="selectLanguage('ru')">Русский</button>
            <button class="lang-btn" onclick="selectLanguage('hi')">हिन्दी</button>
            <button class="lang-btn" onclick="selectLanguage('ja')">日本語</button>
            <button class="lang-btn" onclick="selectLanguage('pt')">Português</button>
            <button class="lang-btn" onclick="selectLanguage('ar')">العربية</button>
            <button class="lang-btn" onclick="selectLanguage('fa')">فارسی</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Repositorio multilingüe de frases
        const phrasesDB = {
            es: [
                "El destino no se cruza en nuestro camino; se dibuja con cada silencio que decidimos no romper.",
                "Toda geometría es un intento del alma por ordenar el caos que habita en las estrellas.",
                "Hay líneas invisibles que atan nuestros pasos a promesas que nunca llegamos a pronunciar.",
                "El compás del tiempo mide círculos cerrados donde el pasado y el futuro siempre se besan.",
                "Perderse en la niebla es el precio obligado para encontrar el centro exacto de uno mismo."
            ],
            en: [
                "Destiny does not cross our path; it is drawn with every silence we choose not to break.",
                "All geometry is the soul's attempt to order the chaos dwelling within the stars.",
                "There are invisible lines binding our steps to promises we never manage to voice."
            ],
            fr: [
                "Le destin ne croise pas notre chemin ; il se dessine avec chaque silence que nous choisissons de ne pas briser.",
                "Toute géométrie est une tentative de l'âme pour ordonner le chaos qui habite les étoiles."
            ],
            de: [
                "Das Schicksal kreuzt nicht unseren Weg; es wird mit jedem Schweigen gezeichnet, das wir nicht zu brechen wagen.",
                "Jede Geometrie ist der Versuch der Seele, das Chaos in den Sternen zu ordnen."
            ],
            ru: [
                "Судьба не пересекает наш путь; она рисуется каждым молчанием, которое мы решаем не нарушать.",
                "Всякая геометрия — это попытка души упорядочить хаос, живущий в звездах."
            ],
            hi: [
                "भाग्य हमारे रास्ते को पार नहीं करता; इसे हर उस सन्नाटे से खींचा जाता है जिसे हम न तोड़ने का फैसला करते हैं।",
                "हर ज्यामिति आत्मा का तारों के भीतर बसنے वाले caos को व्यवस्थित करने का प्रयास है।"
            ],
            ja: [
                "運命は私たちの道を横切るのではなく、私たちが破らないと決めた沈黙ごとに描かれます。",
                "すべての幾何学は、星の中に宿るカオスを秩序づけようとする魂の試みです。"
            ],
            pt: [
                "O destino não cruza o nosso caminho; desenha-se com cada silêncio que decidimos não quebrar.",
                "Toda geometria é uma tentativa da alma de ordenar o caos que habita nas estrelas."
            ],
            ar: [
                "لا يتقاطع القدر مع طريقنا؛ بل يُرسم بكل صمت نختار عدم كسره.",
                "كل هندسة هي محاولة للروح لترتيب الفوضى التي تسكن النجوم."
            ],
            fa: [
                "سرنوشت مسیر ما را قطع نمی‌کند؛ بلکه با هر سکوتی که تصمیم می‌گیریم نشکنیم، ترسیم می‌شود.",
                "هر هندسه‌ای تلاش روح برای نظم بخشیدن به آشفتگی درون ستارگان است."
            ]
        };

        let scene, camera, renderer, bookGroup;
        let currentStep = 0; // 0: Portada, 1: Índice de Idiomas, 2+: Páginas de Frases
        let selectedLang = 'es';
        let currentPhraseText = "";
        let pagesMesh = [];

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0705);

            // Cámara en ángulo cenital/inclinado (perspectiva natural de mesa)
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 7.5, 6.5);
            camera.lookAt(0, -0.2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Luces cálidas de estudio con velas
            const ambient = new THREE.AmbientLight(0xfff3e0, 1.1);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffeed1, 1.5);
            sun.position.set(4, 12, 6);
            sun.castShadow = true;
            scene.add(sun);

            createDesk();
            createRealisticBook();

            window.addEventListener('resize', onWindowResize);
            updateUIState();
            animate();
        }

        function createDesk() {
            // Superficie de madera de roble oscuro
            const deskGeo = new THREE.PlaneGeometry(35, 35);
            const deskMat = new THREE.MeshStandardMaterial({
                color: 0x18100a,
                roughness: 0.8,
                metalness: 0.1
            });
            const desk = new THREE.Mesh(deskGeo, deskMat);
            desk.rotation.x = -Math.PI / 2;
            desk.position.y = -1.2;
            desk.receiveShadow = true;
            scene.add(desk);
        }

        function createTexture(title, bodyText, isCover = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1400;
            const ctx = canvas.getContext('2d');

            if (isCover) {
                // Tapa de cuero oscuro con marco dorado
                ctx.fillStyle = '#2b1a10';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 10;
                ctx.strokeRect(50, 50, canvas.width - 100, canvas.height - 100);

                ctx.fillStyle = '#f4ebd7';
                ctx.font = 'bold 54px "Cinzel", serif';
                ctx.textAlign = 'center';
                ctx.fillText("PALABRAS Y", canvas.width / 2, 500);
                ctx.fillText("FRASES PERDIDAS", canvas.width / 2, 580);

                ctx.font = 'italic 32px "Amiri", serif';
                ctx.fillStyle = '#d4af37';
                ctx.fillText("— Manuscrito Coleccionable —", canvas.width / 2, 700);
            } else {
                // Pergamino envejecido
                ctx.fillStyle = '#f4ebd7';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Bordes oscurecidos / viñeta
                const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 400, canvas.width/2, canvas.height/2, 800);
                grad.addColorStop(0, 'rgba(244, 235, 215, 0)');
                grad.addColorStop(1, 'rgba(110, 80, 50, 0.25)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Marco fino
                ctx.strokeStyle = 'rgba(90, 60, 30, 0.4)';
                ctx.lineWidth = 4;
                ctx.strokeRect(60, 60, canvas.width - 120, canvas.height - 120);

                // Título
                ctx.fillStyle = '#7a2d10';
                ctx.font = 'bold 36px "Cinzel", serif';
                ctx.textAlign = 'center';
                ctx.fillText(title, canvas.width / 2, 180);

                // Texto principal
                ctx.fillStyle = '#2c1d11';
                ctx.font = 'italic 48px "Amiri", serif';
                
                const words = bodyText.split(' ');
                let line = '';
                let lines = [];
                let maxWidth = canvas.width - 240;

                for (let i = 0; i < words.length; i++) {
                    let testLine = line + words[i] + ' ';
                    if (ctx.measureText(testLine).width > maxWidth && i > 0) {
                        lines.push(line);
                        line = words[i] + ' ';
                    } else {
                        line = testLine;
                    }
                }
                lines.push(line);

                let startY = 600 - (lines.length * 30);
                for (let j = 0; j < lines.length; j++) {
                    ctx.fillText(lines[j], canvas.width / 2, startY + (j * 80));
                }
            }

            return new THREE.CanvasTexture(canvas);
        }

        function createRealisticBook() {
            bookGroup = new THREE.Group();
            // Ligeramente inclinado sobre la mesa como en la foto de referencia
            bookGroup.rotation.z = -0.12;
            bookGroup.rotation.y = 0.08;

            // Lomo del libro y cuerpo base apilado
            const spineGeo = new THREE.BoxGeometry(7.4, 5.4, 0.45);
            const leatherMat = new THREE.MeshStandardMaterial({ color: 0x2b1a10, roughness: 0.8 });
            const spine = new THREE.Mesh(spineGeo, leatherMat);
            spine.position.z = -0.2;
            spine.castShadow = true;
            spine.receiveShadow = true;
            bookGroup.add(spine);

            // Bloque de páginas inferiores acumuladas
            const blockGeo = new THREE.BoxGeometry(6.9, 5.0, 0.3);
            const paperBlockMat = new THREE.MeshStandardMaterial({ color: 0xe3d4bc, roughness: 0.9 });
            const paperBlock = new THREE.Mesh(blockGeo, paperBlockMat);
            paperBlock.position.z = 0.05;
            paperBlock.castShadow = true;
            bookGroup.add(paperBlock);

            // Página Izquierda (Fija: Índice o Portada)
            const leftGeo = new THREE.PlaneGeometry(3.3, 4.8);
            leftGeo.translate(-1.65, 0, 0);
            const leftMat = new THREE.MeshStandardMaterial({
                map: createTexture("PALABRAS PERDIDAS", "Portada", true),
                roughness: 0.85
            });
            const leftPage = new THREE.Mesh(leftGeo, leftMat);
            leftPage.position.set(1.65, 0, 0.22);
            leftPage.castShadow = true;
            bookGroup.add(leftPage);

            // Página Derecha (Interactiva / Cambiante)
            const rightGeo = new THREE.PlaneGeometry(3.3, 4.8);
            rightGeo.translate(1.65, 0, 0);
            const rightMat = new THREE.MeshStandardMaterial({
                map: createTexture("ARCHIVADOR", "Selecciona tu idioma en el menú flotante."),
                roughness: 0.85
            });
            const rightPage = new THREE.Mesh(rightGeo, rightMat);
            rightPage.position.set(-1.65, 0, 0.24);
            rightPage.castShadow = true;
            bookGroup.add(rightPage);
            pagesMesh.push(rightPage);

            scene.add(bookGroup);
        }

        function nextStep() {
            if (currentStep === 0) {
                // Pasar de Portada a Índice de Idiomas
                currentStep = 1;
                document.getElementById('langMenu').style.display = 'grid';
                document.getElementById('pageIndicator').textContent = "Índice de Idiomas";
            } else if (currentStep >= 1) {
                // Obtener frase aleatoria del idioma seleccionado
                const list = phrasesDB[selectedLang] || phrasesDB['es'];
                currentPhraseText = list[Math.floor(Math.random() * list.length)];
                
                // Actualizar textura de la página derecha con la nueva frase aleatoria
                pagesMesh[0].material.map = createTexture(`BLOQUE DE REFLEXIÓN (${selectedLang.toUpperCase()})`, currentPhraseText);
                pagesMesh[0].material.needsUpdate = true;

                currentStep++;
                document.getElementById('pageIndicator').textContent = `Página de Pensamientos (${currentStep - 1})`;
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                if (currentStep === 1) {
                    document.getElementById('langMenu').style.display = 'grid';
                    document.getElementById('pageIndicator').textContent = "Índice de Idiomas";
                } else if (currentStep === 0) {
                    document.getElementById('langMenu').style.display = 'none';
                    document.getElementById('pageIndicator').textContent = "Portada";
                }
            }
        }

        function selectLanguage(lang) {
            selectedLang = lang;
            document.getElementById('langMenu').style.display = 'none';
            
            // Seleccionar primera frase aleatoria de ese idioma y avanzar
            const list = phrasesDB[selectedLang] || phrasesDB['es'];
            currentPhraseText = list[Math.floor(Math.random() * list.length)];
            
            pagesMesh[0].material.map = createTexture(`BLOQUE DE REFLEXIÓN (${selectedLang.toUpperCase()})`, currentPhraseText);
            pagesMesh[0].material.needsUpdate = true;

            currentStep = 2;
            document.getElementById('pageIndicator').textContent = `Página de Pensamientos (1)`;
        }

        function updateUIState() {
            document.getElementById('langMenu').style.display = 'none';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
